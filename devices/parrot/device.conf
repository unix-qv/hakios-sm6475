# devices/parrot/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device parrot
	title       POCO M8 5G
	vendor      Xiaomi
	soc         sm6475
	defconfig   parrot_defconfig
	firmware    pull-firmware.sh
	maintainer  unix-qv
	status      display     works     1080x2392 panel via U-Boot resident framebuffer at 0xb8000000; SpringBoard UI renders
	status      cpu         works     all 8 cores (4x A78 + 4x A55), boot on core 7 at max freq (cpus=8 bootcpu=7 cpufreq=1)
	status      torch       works     SPMI v7 PM6150L slave 5 reg 0xd34c dual flash LED (torch=3)
	status      buttons     works     power and volume keys via PMIC (buttons=1)
	status      storage     works     resident APFS ramdisk /dev/md0 (6GB slim and 8GB models supported)
	status      touch       partial   Goodix GT9916 / FocalTech via SPI/I2C (patch_touch_parrot.py)
	status      battery     partial   PMIC fuel gauge readings via SPMI
	status      gpu         missing   software rendering (llvmpipe); Adreno 710 Metal driver in progress
	status      audio       missing   ADSP audio routing pending
	status      camera      missing   camera sensor bring-up pending
	status      wifi        missing   Wi-Fi firmware blobs pending
	status      bluetooth   missing   Bluetooth UART/HCI bring-up pending
	status      cellular    missing   modem IPA/QMI bring-up pending
